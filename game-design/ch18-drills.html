<title>Eigen Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=STIX+Two+Text:ital,wght@1,500&display=swap">
<style>
/* Layout. Phone: drill tabs, the task, the picture (it takes the free height), the answer, the feedback, then a dock pinned to the bottom with the buttons and number pad.
   Wide screens and phones on their side: picture on the left; a right-hand panel with the task, answer and feedback scrolls on its own, with the dock pinned to its bottom. */
/* The game's own look, dark only by choice: space-black ground, cyan accent. Maths colours: green = x, yellow = Ax, violet = a kept line. */
:root {
  color-scheme: dark;
  --bg: #05070f;
  --surface: #0b1122;
  --surface-2: #121c36;
  --line: rgba(140, 180, 255, 0.16);
  --line-2: rgba(140, 180, 255, 0.32);
  --ink: #e8f1ff;
  --ink-2: #b8c4da;
  --muted: #7d8aa5;
  --accent: #59e1ff;
  --accent-ink: #031018;
  --accent-tint: rgba(89, 225, 255, 0.12);
  --green: #3ddc84;
  --yellow: #ffd166;
  --violet: #b388ff;
  --violet-tint: rgba(179, 136, 255, 0.13);
  --bad: #ff7a85;
  --bad-tint: rgba(255, 122, 133, 0.1);
  --grid: #13274d;
  --axis: #3c659f;
  --scene: #060a16;
  --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --text: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --math: 'STIX Two Text', 'Times New Roman', Georgia, serif;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--text); padding: 0 16px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { min-height: 100%; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }

/* header: a short title and the three drills */
.top { display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: baseline; gap: 8px; line-height: 1.2; }
.brand .kick { font: 600 11px var(--text); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.brand .name { font: 600 13px var(--display); color: var(--ink-2); }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tab { border: 0; background: transparent; border-radius: 9px; min-height: 44px; padding: 0 6px; font-size: 14px; font-weight: 500; color: var(--ink-2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.tab .n { font: 600 12px var(--mono); color: var(--muted); }
.tab .ck { color: var(--accent); font-size: 12px; }
.tab[aria-selected="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.tab[aria-selected="true"] .n { color: var(--accent); }

/* the play area */
.stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.panel { display: contents; }
.task { order: 1; display: flex; flex-direction: column; gap: 6px; }
.visual { order: 2; flex: 1 1 0; min-height: 150px; display: flex; flex-direction: column; }
.controls { order: 3; }
.feedback { order: 4; }
.dock { order: 5; position: sticky; bottom: 0; z-index: 5; margin: auto -16px 0; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.stage[data-phase="why"] .visual, .stage[data-phase="done"] .visual { flex: 1 0 auto; }
.visual.idle { display: none; }
.visual.has-tiles { min-height: auto; }

.meta { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.meta .again { color: var(--violet); font-weight: 500; }
.meta .step { margin-left: auto; color: var(--ink-2); }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.dot.ok { background: var(--accent); }
.dot.help { background: transparent; box-shadow: inset 0 0 0 1.5px var(--accent); }
.dot.miss { background: var(--bad); }
.dot.now { background: var(--ink); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--ink); }
.pips { margin-left: auto; display: flex; align-items: center; gap: 5px; color: var(--ink-2); }
.pip { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-2); }
.pip.on { background: var(--accent); border-color: var(--accent); }
.taskrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tasktext { min-width: 0; }
.tasktext h1 { margin: 0; font: 600 17px/1.3 var(--display); text-wrap: balance; }
.tasktext p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-2); text-wrap: pretty; }
.legend { display: none; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; height: 3px; border-radius: 2px; }
.sw.g { background: var(--green); }
.sw.y { background: var(--yellow); }
.sw.v { background: var(--violet); }
.sw.d { background: repeating-linear-gradient(90deg, var(--green) 0 4px, transparent 4px 7px); }

/* maths type: vectors are always columns */
.mi { font-family: var(--math); font-style: italic; font-weight: 500; font-size: 1.14em; white-space: nowrap; }
.nw { white-space: nowrap; }
.amat { display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; font-size: 15px; }
.mat, .cv { display: inline-grid; font: 500 15px/1.3 var(--mono); padding: 2px 7px; border-left: 2px solid var(--ink-2); border-right: 2px solid var(--ink-2); border-radius: 7px; text-align: center; vertical-align: middle; }
.mat { grid-template-columns: auto auto; column-gap: 12px; }
.cv { grid-template-columns: auto; }
.cv.in { font-size: 0.8em; line-height: 1.12; padding: 0 4px; border-width: 1.5px; border-radius: 5px; margin: 1px 1px; }
.cv.sm { font-size: 12px; line-height: 1.2; padding: 1px 5px; border-width: 1.5px; }
.cv.md { font-size: 16px; }
.cv.lg { font-size: 19px; padding: 3px 9px; }
.cv.g { color: var(--green); border-color: var(--green); }
.cv.y { color: var(--yellow); border-color: var(--yellow); }

/* the picture */
.scene { flex: 1; width: 100%; min-height: 0; display: block; border-radius: 14px; border: 1px solid var(--line); background: var(--scene); }
.grid line { stroke: var(--grid); }
.axes line { stroke: var(--axis); }
.arw line { stroke-linecap: round; }
.arw.g line { stroke: var(--green); }
.arw.g polygon { fill: var(--green); }
.arw.y line { stroke: var(--yellow); }
.arw.y polygon { fill: var(--yellow); }
.ln.dash { stroke: var(--green); }
.ln.found { stroke: var(--violet); }
.dot-y { fill: var(--yellow); }
.lbl { paint-order: stroke; stroke: var(--scene); stroke-linejoin: round; }
.lbl.g { fill: var(--green); font-family: var(--math); font-style: italic; }
.lbl.y { fill: var(--yellow); font-family: var(--math); font-style: italic; }
.lbl.v { fill: var(--violet); font-family: var(--mono); }

/* drill 1: five tiles and "None of these" */
.tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(min-content, 1fr)); gap: 8px; }
.tile { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 4px; padding: 28px 6px 8px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--scene); cursor: pointer; text-align: center; }
.tile:hover:not(:disabled) { border-color: var(--line-2); }
.tile[aria-pressed="true"] { border-color: var(--violet); background: var(--violet-tint); }
.tile:disabled { cursor: default; }
.tile.right { border-color: var(--accent); background: var(--scene); }
.tile.wrong { border-color: var(--bad); background: var(--bad-tint); }
.tile.answer { border-color: var(--accent); border-style: dashed; background: var(--scene); }
.tile svg { flex: 1 1 0; min-height: 36px; width: 100%; display: block; }
.tile .tick { position: absolute; top: 7px; left: 7px; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--accent-ink); background: var(--scene); }
.tile[aria-pressed="true"] .tick { background: var(--violet); border-color: var(--violet); }
.tile.answer .tick { background: transparent; border-style: dashed; border-color: var(--accent); color: var(--accent); }
.tile .mark { position: absolute; top: 5px; right: 9px; font-weight: 700; font-size: 16px; }
.tile.right .mark { color: var(--accent); }
.tile.wrong .mark { color: var(--bad); }
.cap { flex: none; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 6px; font-size: 13px; color: var(--ink-2); }
.tile.nums .cap { flex: 1 1 auto; font-size: 15px; }
.pair { display: inline-grid; grid-template-columns: auto auto auto; align-items: center; justify-items: center; column-gap: 6px; row-gap: 2px; }
.pair .pl { font-size: 12px; color: var(--muted); }
.pair .arrow { color: var(--muted); }
.reason { flex: none; font-size: 11.5px; line-height: 1.25; color: var(--ink-2); }
.tile.wrong .reason { color: var(--ink); }
.none-txt { flex: 1 1 auto; display: grid; place-items: center; font: 600 15px/1.25 var(--display); color: var(--ink-2); }

/* end-of-drill question and summary */
.card { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.card h2 { margin: 0; font: 600 17px/1.35 var(--display); text-wrap: balance; }
.card p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.stmts { display: flex; flex-direction: column; gap: 8px; }
.stmt { position: relative; display: flex; align-items: flex-start; gap: 12px; text-align: left; min-height: 48px; padding: 11px 36px 11px 12px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--scene); cursor: pointer; }
.stmt:disabled { cursor: default; }
.stmt .box { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--accent-ink); }
.stmt[aria-pressed="true"] { border-color: var(--violet); }
.stmt[aria-pressed="true"] .box { background: var(--violet); border-color: var(--violet); }
.stmt .st { display: flex; flex-direction: column; gap: 4px; }
.stmt .sw-why { font-size: 13px; color: var(--ink-2); }
.stmt .mark { position: absolute; top: 11px; right: 12px; font-weight: 700; }
.stmt.right { border-color: var(--accent); }
.stmt.right .mark { color: var(--accent); }
.stmt.wrong { border-color: var(--bad); background: var(--bad-tint); }
.stmt.wrong .mark { color: var(--bad); }
.score { display: flex; align-items: baseline; gap: 10px; }
.score b { font: 600 44px/1 var(--display); color: var(--accent); }
.score span { color: var(--ink-2); }
.facts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.facts li::before { content: '·'; color: var(--accent); margin-right: 8px; }
.key-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.key-row span { display: inline-flex; align-items: center; gap: 6px; }
.def { padding: 12px 14px; border-radius: 11px; border: 1px solid var(--accent); background: var(--accent-tint); color: var(--ink); }

/* answers */
.ctl { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; }
.field { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; }
.field .mi { font-size: 1.25em; }
.lamval { font: 600 20px var(--mono); color: var(--ink); }
.cells { display: inline-grid; gap: 5px; }
.cells.col { grid-template-columns: auto; padding: 3px 6px; border-left: 2px solid var(--ink-2); border-right: 2px solid var(--ink-2); border-radius: 8px; }
.cells.row { grid-auto-flow: column; align-items: center; gap: 6px; font-size: 16px; }
.cell { position: relative; min-width: 60px; height: 44px; padding: 0 10px; display: flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px solid var(--line-2); background: var(--scene); font: 500 18px var(--mono); color: var(--ink); cursor: text; user-select: none; -webkit-user-select: none; }
.cell.empty { color: var(--muted); }
.cell.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-tint); }
.cell.fresh .val { background: rgba(89, 225, 255, 0.24); border-radius: 4px; padding: 0 3px; }
.caret { width: 2px; height: 1.05em; margin-left: 2px; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.side { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; flex: 1 1 160px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 13px; border: 1px solid var(--violet); color: var(--violet); background: var(--violet-tint); }
.chip.rev { border-style: dashed; background: transparent; }
.chip.empty { border-color: var(--line); color: var(--muted); background: transparent; }
.eqn { font-size: 13.5px; color: var(--ink-2); }
.claim { display: flex; flex-direction: column; gap: 10px; }
.claim .setup { font-size: 14px; color: var(--ink-2); }
.claim .tv { font-family: var(--math); font-style: italic; font-size: 1.15em; }

/* feedback: hints stay above the latest result */
.feedback { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.feedback:empty { display: none; }
.feedback p, .feedback details { margin: 0; padding-left: 12px; border-left: 2px solid var(--line-2); text-wrap: pretty; }
.feedback .good { color: var(--ink); border-left-color: var(--accent); }
.feedback .bad { color: var(--ink); border-left-color: var(--bad); }
.feedback .note { color: var(--ink-2); }
.feedback .hint, .feedback .work { color: var(--ink-2); border-left-style: dashed; border-left-color: var(--violet); }
.feedback .tag { font-weight: 600; margin-right: 6px; }
.feedback .good .tag { color: var(--accent); }
.feedback .bad .tag { color: var(--bad); }
.feedback .hint .tag, .feedback .work .tag { color: var(--violet); }
.feedback summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 4px 0; }
.feedback details > div { color: var(--ink-2); padding-top: 4px; }
.pop { animation: pop 0.28s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* buttons */
.actions { display: flex; gap: 8px; }
.btn { min-height: 46px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.primary { flex: 1; min-width: 0; white-space: normal; line-height: 1.15; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.small { min-height: 44px; font-size: 13.5px; }

/* number pad (touch screens) */
.keypad { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
.key { min-height: 44px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font: 500 18px var(--mono); color: var(--ink); cursor: pointer; padding: 0; }
.key.fn { font-size: 15px; color: var(--ink-2); }
.key.wide { grid-column: span 2; }
.key:disabled { opacity: 0.35; }
.kbd-note { display: none; font-size: 12px; color: var(--muted); }
@media (hover: hover) and (pointer: fine) {
  .keypad { display: none; }
  .kbd-note:not(:empty) { display: block; }
}

@media (max-width: 399px) {
  .tab { gap: 4px; padding: 0 4px; font-size: 13.5px; }
  .tab .ck { display: none; }
}
/* short phones: tighten text so the picture keeps its room */
@media (max-width: 899px) and (max-height: 700px) {
  .tasktext h1 { font-size: 15.5px; }
  .tasktext p { font-size: 12.5px; }
  .visual { min-height: 130px; }
  .cell { height: 40px; }
}

/* wide screens and phones on their side */
@media (min-width: 900px), (orientation: landscape) and (max-height: 560px) {
  .app { height: 100%; min-height: 0; padding-top: 12px; gap: 12px; }
  .top { flex-direction: row; align-items: center; gap: 16px; }
  .brand { flex-direction: column; gap: 0; }
  .brand .name { font-size: 19px; color: var(--ink); }
  .tabs { flex: 0 1 480px; margin-left: auto; }
  .stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr); grid-template-rows: minmax(0, 1fr); gap: 0 28px; padding-bottom: 14px; }
  .visual, .visual.idle, .visual.has-tiles { grid-column: 1; grid-row: 1; min-height: 0; display: flex; }
  .panel { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding: 2px 4px 0 2px; }
  .dock { margin: auto 0 0; padding: 10px 0 2px; border-top: 0; }
  .legend { display: flex; }
  .stage[data-phase="why"] .visual, .stage[data-phase="done"] .visual { overflow-y: auto; }
}
@media (min-width: 900px) {
  .tasktext h1 { font-size: 21px; }
  .tasktext p { font-size: 14.5px; }
  .tiles { gap: 12px; }
  .cap { font-size: 14px; }
  .reason { font-size: 13px; }
  .card { padding: 22px; }
  .card h2 { font-size: 19px; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .brand, .legend { display: none; }
  .app { padding-top: 6px; gap: 6px; }
  .tab { min-height: 38px; }
  .stage { padding-bottom: 6px; }
  .tasktext h1 { font-size: 15px; }
  .tasktext p { font-size: 12.5px; }
  .key { min-height: 38px; }
  .btn { min-height: 40px; }
  .cell { height: 38px; }
  .dock { padding-top: 6px; gap: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  .pop, .caret { animation: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="kick">Chapter 18</span><span class="name">Eigenvectors</span></div>
    <div class="tabs" role="tablist" aria-label="Drills" id="tabs"></div>
  </header>
  <main class="stage" id="stage">
    <section class="visual" id="visual"></section>
    <div class="panel" id="panel">
      <section class="task" id="task"></section>
      <section class="controls" id="controls"></section>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="dock" id="dock">
        <div class="actions" id="actions"></div>
        <div class="keypad" id="keypad" role="group" aria-label="Number keys"></div>
        <div class="kbd-note" id="kbdnote"></div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';
const MINUS = '−', TIMES = '×';
const EPS = 1e-9;
const TESTS = 3;
const LOCK_MS = 400;
const STORE = 'singular-eigen-drills-v2';

// ------------------------------------------------------------------ maths (2 x 2)
const mul = (A, x) => [A[0][0] * x[0] + A[0][1] * x[1], A[1][0] * x[0] + A[1][1] * x[1]];
const tr = (A) => [[A[0][0], A[1][0]], [A[0][1], A[1][1]]];
const det = (A) => A[0][0] * A[1][1] - A[0][1] * A[1][0];
const cross = (u, v) => u[0] * v[1] - u[1] * v[0];
const dot = (u, v) => u[0] * v[0] + u[1] * v[1];
const len = (v) => Math.hypot(v[0], v[1]);
const isZero = (v) => len(v) < 1e-7;
const parallel = (u, v) => Math.abs(cross(u, v)) <= 1e-7 * Math.max(1, len(u) * len(v));
const close = (u, v) => Math.abs(u[0] - v[0]) < 1e-6 && Math.abs(u[1] - v[1]) < 1e-6;
// A keeps x on its own line when Ax lies on the line through x (Ax = 0 counts: 0 is on every line)
const onLine = (A, x) => { const y = mul(A, x); return isZero(y) || parallel(x, y); };
const stretchOf = (A, x) => dot(x, mul(A, x)) / dot(x, x);
// how far Ax is from x's line, in degrees (backwards is on the line)
const offLineDeg = (A, x) => { const y = mul(A, x); if (isZero(y)) return 0; const t = Math.abs(Math.atan2(cross(x, y), dot(x, y))) * 180 / Math.PI; return Math.min(t, 180 - t); };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const cols = (A) => [[A[0][0], A[1][0]], [A[0][1], A[1][1]]];

// the simplest whole-number arrow along v, pointing right (or up)
function niceDir(v) {
  const m = Math.max(Math.abs(v[0]), Math.abs(v[1]));
  if (m < EPS) return [0, 0];
  const u = [v[0] / m, v[1] / m];
  let p = null;
